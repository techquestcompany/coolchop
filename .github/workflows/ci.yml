name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run backend tests
        run: npm test --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Type-check order contracts
        run: npm run typecheck:contracts --prefix frontend

      - name: Test order and checkout contracts
        run: npm run test:contracts --prefix frontend

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/coolchop-expo-export"
        working-directory: frontend